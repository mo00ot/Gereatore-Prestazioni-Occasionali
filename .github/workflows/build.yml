# Compila l'app per macOS (Apple Silicon), Windows e Linux.
# Su GitHub: scheda Actions -> "Compila app" -> Run workflow, poi scarica gli Artifacts.
name: Compila app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            nome: Ricevute-macOS-arm64
          - os: windows-latest
            nome: Ricevute-Windows
          - os: ubuntu-22.04
            nome: Ricevute-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: pip install -r requirements.txt pyinstaller
      - run: >
          pyinstaller --noconfirm --clean --windowed
          ${{ runner.os == 'macOS' && '--onedir' || '--onefile' }}
          --name Ricevute --add-data "font:font" --exclude-module pydoc
          --exclude-module numpy ricevute.py
      - if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent Ricevute.app Ricevute-macOS-arm64.zip && rm -rf Ricevute Ricevute.app
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.nome }}
          path: dist/*
